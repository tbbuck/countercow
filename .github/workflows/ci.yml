name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# A push that supersedes an earlier one on the same ref makes the earlier run's answer
# irrelevant, and these jobs build the whole dependency tree twice over.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: clippy and tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux and macOS both, because the two things this binary touches most — the socket
        # directory ($TMPDIR differs) and thread-time sampling — behave differently on each.
        # No Windows: the IPC layer is std::os::unix::net::UnixStream, so it does not build there.
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      # Lints but no `cargo fmt --check`, deliberately: this repo is not rustfmt-clean, because
      # several byte-layout tables are laid out by hand to be read as tables and rustfmt unpicks
      # them. Formatting is not the thing worth failing a build over here; warnings are.
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --locked

  msrv:
    name: build on the declared MSRV (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          # Cargo.toml claims 1.88 and the README claims it is verified rather than declared.
          # This is that verification: a dependency that quietly raises its own floor breaks the
          # claim, and only building on the old compiler catches it.
          toolchain: "1.88"

      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv

      # --locked matters more here than anywhere else: the committed lockfile is what holds the
      # dependency versions down to ones that still compile on 1.88. Resolving afresh would pull
      # newer minors and test a tree nobody ships.
      - name: Build
        run: cargo build --locked
