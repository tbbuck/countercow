name: Release

on:
  # Two ways in, because the tag can arrive from either direction:
  #  - a maintainer pushing a tag by hand, which triggers workflows normally;
  #  - version.yml calling this workflow directly. It has to call rather than rely on the tag it
  #    just pushed, because a push made with the default GITHUB_TOKEN never triggers another
  #    workflow — that is GitHub's loop guard, and it applies to tags as much as to branches.
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      tag:
        description: The tag to build and release, e.g. v1.4.0
        required: true
        type: string

# Permissions are set per job rather than for the whole workflow on purpose. A called workflow can
# only ever hold less than its caller granted, and a workflow-level block here would be one more
# place for the write the publish job needs to be narrowed away by mistake.
jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # `native` marks the targets the runner can execute, which are the only ones the
          # smoke test below can run.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            native: true
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          # macos-latest is arm64, so the Apple Silicon build is native and the Intel one is the
          # cross. Both link against the SDK Xcode already ships, so neither needs extra tooling.
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
            native: true
    steps:
      - uses: actions/checkout@v4
        with:
          # On a tag push this is the tag anyway; on a workflow_call it is the tag version.yml
          # just pushed, which is a different commit from the ref this workflow was loaded at.
          ref: ${{ inputs.tag || github.ref_name }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # Cross-linking with the Ubuntu cross-gcc rather than `cross`: countercow is pure Rust with
      # no C to compile and no build scripts, so the only thing missing for aarch64 is a linker
      # that knows the target. `cross` would solve the same problem by way of Docker and an image
      # download — more moving parts for no more coverage.
      - name: Install the aarch64 cross linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install --yes gcc-aarch64-linux-gnu

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
        env:
          # Ignored by every other target in the matrix, so it can live here unconditionally.
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      # The only point in the pipeline where the thing being shipped is run at all. It catches a
      # binary that linked but cannot start — the failure mode a cross-compile is most likely to
      # produce — on the two targets a runner can execute.
      - name: Smoke test
        if: matrix.native
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          "target/$TARGET/release/countercow" --version

      - name: Package
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          TARGET: ${{ matrix.target }}
          # bsdtar on macOS otherwise stores extended attributes as ._ members, which land in the
          # tarball as junk files beside the binary.
          COPYFILE_DISABLE: "1"
        run: |
          set -euo pipefail

          version="${TAG#v}"
          declared="$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"
          # A tag that disagrees with Cargo.toml would ship a binary reporting one version inside
          # a file named for another. Cheap to check, confusing to debug later.
          if [ "$version" != "$declared" ]; then
              echo "Tag $TAG does not match the version in Cargo.toml ($declared)" >&2
              exit 1
          fi

          # Everything sits under one directory inside the tarball so unpacking in a downloads
          # folder leaves one thing behind rather than three.
          name="countercow-$version-$TARGET"
          mkdir -p "dist/$name"
          cp "target/$TARGET/release/countercow" "dist/$name/"
          cp LICENSE README.md "dist/$name/"
          tar -czf "dist/$name.tar.gz" -C dist "$name"

      - uses: actions/upload-artifact@v4
        with:
          name: tarball-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  release:
    name: publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # One release built from all four tarballs at once, rather than each build job appending to
      # it: four jobs racing to create the same release is a known way to get a 422, and the
      # checksums have to be listed together to be checkable with a single `sha256sum -c`.
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: tarball-*
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum *.tar.gz > SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          # A packaging change that quietly stops producing files should fail the release rather
          # than publish an empty one.
          fail_on_unmatched_files: true
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
