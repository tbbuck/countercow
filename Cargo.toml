[package]
name = "countercow"
version = "1.8.0"
edition = "2021"
# Held down deliberately. The only thing that wanted more was sysinfo 0.39, which jumped to
# 1.95 for no feature this uses; 0.38 does the same job at 1.88. Everything else in the tree,
# ratatui included, is happy at 1.88.
rust-version = "1.88"
description = "A btop for .NET: live runtime counters, GC and allocation forensics, and a CPU profiler, in one terminal binary"
license = "MIT"
repository = "https://github.com/tbbuck/countercow"
readme = "README.md"
keywords = ["dotnet", "tui", "profiler", "diagnostics", "eventpipe"]
categories = ["command-line-utilities", "development-tools::profiling"]

[dependencies]
clap = { version = "4", features = ["derive"] }
color-eyre = "0.6"
crossbeam-channel = "0.5"
crossterm = "0.29"
# Already in the tree several times over as a transitive dependency; declared here only to catch
# SIGTERM and SIGHUP, so being killed does not leave the terminal in raw mode.
libc = "0.2"
ratatui = "0.30.2"
# Pinned exactly: sysinfo changes its API across minor versions, so a float here breaks builds
# rather than just moving them.
sysinfo = "=0.38.4"

[profile.release]
lto = true
strip = true
